workerPoolSpecs:
  - machineSpec:
      machineType: n1-highmem-16
      acceleratorType: NVIDIA_TESLA_T4
      acceleratorCount: 1 
    replicaCount: 1
    pythonPackageSpec:
      executorImageUri: us-docker.pkg.dev/vertex-ai/training/tf-gpu.2-11.py310:latest 
      packageUris: 
        - gs://flood-data-11-29-23/trainer-0.1.tar.gz 
      pythonModule: trainer.task
      args: ["--parameter-config", "parameter_config.json", "--model-config", "model_config.json"]
      env:
        - name: "LOG_LEVEL"
          value: "DEBUG"
        - name: "TRAIN_ENV"
          value: "cloud"
baseOutputDirectory:
  outputUriPrefix: gs://flood-data-11-29-23

