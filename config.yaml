workerPoolSpecs:
  - machineSpec:
      machineType: n1-highmem-16
    replicaCount: 1
    pythonPackageSpec:
      executorImageUri: gcr.io/certain-density-406704/flood-detection-training-tf-cpu.2-13.py310
      packageUris: 
        - gs://sar-flood-detection/trainer-0.1.tar.gz
      pythonModule: trainer.task
      args: ["--train", "--save-model", "--save-metadata", "--parameter-config", "local_s1_parameter_config.json", "--model-config", "cloud_s1_model_config.json"]
      env:
        - name: "LOG_LEVEL"
          value: "DEBUG"
        - name: "TRAIN_ENV"
          value: "cloud"
        - name: "MODEL_TYPE"
          value: "single"
        - name: "MODEL_ID"
          value: "0"
baseOutputDirectory:
  outputUriPrefix: gs://sar-flood-detection
tensorboard: projects/certain-density-406704/locations/us-west1/tensorboards/4035295634868142080
