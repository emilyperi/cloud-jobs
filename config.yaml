workerPoolSpecs:
  - machineSpec:
      machineType: n1-highmem-16
    replicaCount: 1
    pythonPackageSpec:
      executorImageUri: us-docker.pkg.dev/vertex-ai/training/tf-cpu.2-12.py310:latest
      packageUris: 
        - gs://flood-data-11-29-23/trainer-0.1.tar.gz 
      pythonModule: trainer.task
      args: ["--train", "--save-model", "--save-metadata", "--parameter-config", "parameter_config.json", "--model-config", "model_config.json"]
      env:
        - name: "LOG_LEVEL"
          value: "DEBUG"
        - name: "TRAIN_ENV"
          value: "cloud"
        - name: "MODEL_TYPE"
          value: "single"
        - name: "MODEL_ID"
          value: "4"
        - name: "DATA_AUGMENT"
          value: "1"
baseOutputDirectory:
  outputUriPrefix: gs://flood-data-11-29-23
tensorboard: projects/certain-density-406704/locations/us-west1/tensorboards/3404580580803739648
